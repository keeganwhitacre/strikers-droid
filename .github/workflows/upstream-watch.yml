name: Upstream version watch

# Opens an issue when new-coke/strikers tags a version newer than the one this fork's Android build
# reports. Online play compares that version string exactly, so until the fork syncs, Android
# players cannot join anyone on the new upstream release.

on:
  schedule:
    - cron: '17 13 * * *'   # daily, 13:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: smstrikers-port/tools/configure-android.sh
          sparse-checkout-cone-mode: false

      - name: Compare with upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ours=$(sed -n 's/.*STRIKERS_VERSION:-\([0-9][0-9.]*\)}.*/\1/p' smstrikers-port/tools/configure-android.sh)
          if [ -z "$ours" ]; then
            echo "::error::Could not read the native version from tools/configure-android.sh"
            exit 1
          fi
          theirs=$(gh api --paginate repos/new-coke/strikers/tags --jq '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n 1)
          echo "fork: $ours  upstream: $theirs"
          if [ -z "$theirs" ] || [ "$(printf '%s\n%s\n' "$ours" "$theirs" | sort -V | tail -n 1)" = "$ours" ]; then
            echo "Up to date."
            exit 0
          fi

          title="Upstream released v$theirs"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "\"$title\" in:title" \
            --json title --jq ".[] | select(.title == \"$title\") | .title")
          if [ -n "$existing" ]; then
            echo "An issue for v$theirs already exists."
            exit 0
          fi

          body=$(cat <<EOF
          new-coke/strikers tagged [v$theirs](https://github.com/new-coke/strikers/releases/tag/v$theirs). This fork's Android build still reports $ours, so Android players cannot play online with anyone on v$theirs.

          To sync:
          1. Merge upstream's \`v$theirs\` tag into \`main\`, keeping the Android changes.
          2. Change the default \`STRIKERS_VERSION\` in \`smstrikers-port/tools/configure-android.sh\` from \`$ours\` to \`$theirs\`.
          3. Run the device checklist in README-android.md, including an Android-to-desktop online match against upstream's v$theirs build.
          4. Release \`$theirs-android.1\` from **Actions → Android release**.
          EOF
          )
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
